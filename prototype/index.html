<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#090e1b">
  <title>EternalForge — Rebuild Lab</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main id="game-root" aria-label="EternalForge rebuild test"></main>
  <div class="safe-hud">
    <div class="brand">ETERNALFORGE <span>REBUILD LAB</span></div>
    <div class="hint">PROTOTIPO TECNICO · PERSONAGGIO TEMPORANEO</div>
    <div class="state" id="state-readout">STATO: IDLE</div>
  </div>
  <div class="touch-controls" aria-label="Controlli">
    <div class="move-pad">
      <button data-key="left" aria-label="Sinistra">◀</button>
      <button data-key="right" aria-label="Destra">▶</button>
    </div>
    <div class="action-pad">
      <button data-action="dodge">SCATTO</button>
      <button data-action="jump">SALTO</button>
      <button class="attack" data-action="attack">ATTACCO</button>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
