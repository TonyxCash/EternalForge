<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101827"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>EternalForge — Awakening</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101827;color:#fff;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}.hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 14px calc(env(safe-area-inset-bottom) + 12px);display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(180deg,#07101dbb,transparent 24%,transparent 70%,#07101d99)}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.brand{font-weight:900;letter-spacing:.13em;font-size:12px;color:#f3c979;text-shadow:0 2px 10px #000}.stats{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.pill{background:#101b2bd9;border:1px solid #ffffff25;border-radius:12px;padding:7px 10px;font-size:11px;box-shadow:0 4px 16px #0005}.bars{width:min(190px,43vw);margin-top:7px}.bar{height:7px;border-radius:10px;background:#ffffff30;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#b52f38,#ff7b66)}.bar.mana i{background:linear-gradient(90deg,#2369c9,#65caff)}.quest{align-self:center;margin-top:10px;text-align:center;background:#111d2bc9;border:1px solid #e8bd6c66;border-radius:12px;padding:9px 14px;max-width:80vw;font-size:12px}.quest b{color:#f2cc7c;display:block;font-size:10px;letter-spacing:.12em;margin-bottom:3px}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}.joystick{pointer-events:auto;width:112px;height:112px;border-radius:50%;background:#dbe8ff18;border:1px solid #ffffff50;position:relative;backdrop-filter:blur(5px);touch-action:none}.stick{position:absolute;width:46px;height:46px;border-radius:50%;background:#e5c17d99;border:2px solid #ffe2a8;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:0 3px 14px #0008}.actions{pointer-events:auto;display:flex;align-items:flex-end;gap:10px}.action{border:1px solid #f4d08b99;color:#fff;background:radial-gradient(circle at 30% 20%,#72512f,#241d1c);border-radius:50%;width:62px;height:62px;font-weight:800;font-size:11px;box-shadow:0 5px 15px #0008;touch-action:manipulation}.action.primary{width:76px;height:76px;background:radial-gradient(circle at 30% 20%,#b84a38,#421c24);font-size:12px}.hint{font-size:10px;color:#d8dfebaa;text-align:center;margin-top:5px}#notice{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:#111d2bee;border:1px solid #e9c477;border-radius:14px;padding:16px 20px;text-align:center;max-width:80vw;pointer-events:none;opacity:0;transition:opacity .2s}#notice.show{opacity:1}.rotate{display:none}@media(orientation:portrait){.rotate{display:flex;position:fixed;inset:0;background:#091321ee;z-index:10;align-items:center;justify-content:center;text-align:center;padding:30px;font-size:18px;flex-direction:column}.rotate span{display:block;font-size:12px;color:#cbd5e1;margin-top:10px}.hud{opacity:.18}}@media(orientation:landscape){.rotate{display:none}}
</style></head><body><div id="game"></div><div class="rotate">↻ Ruota l’iPhone in orizzontale<span>EternalForge è progettato per la modalità landscape.</span></div>
<div class="hud"><div class="top"><div><div class="brand">ETERNALFORGE <span style="color:#fff8">/ AWAKENING</span></div><div class="bars"><div style="font-size:10px">LV. 1 · APPRENDISTA</div><div class="bar"><i id="hp"></i></div><div class="bar mana"><i id="mp"></i></div></div></div><div class="stats"><div class="pill">✦ <span id="gold">120</span> oro</div><div class="pill">⚔ <span id="kills">0</span> / 3</div><div class="pill">FPS <span id="fps">—</span></div></div></div><div class="quest"><b>INCARICO INIZIALE</b><span id="quest">Esplora la radura e trova le creature corrotte.</span></div><div class="bottom"><div><div class="joystick" id="joy"><div class="stick" id="stick"></div></div><div class="hint">MUOVI</div></div><div class="actions"><button class="action" id="forge">FORGIA</button><button class="action primary" id="attack">ATTACCO</button><button class="action" id="skill">ABILITÀ</button></div></div></div><div id="notice"></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const root=document.querySelector('#game'),scene=new THREE.Scene();scene.background=new THREE.Color(0x91a9b5);scene.fog=new THREE.Fog(0x91a9b5,22,65);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,150);camera.position.set(0,7,11);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xdcecff,0x46533b,2));const sun=new THREE.DirectionalLight(0xffe2b2,3);sun.position.set(-8,14,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x526b4c));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);const grid=new THREE.GridHelper(100,50,0x71866a,0x71866a);grid.position.y=.012;grid.material.transparent=true;grid.material.opacity=.12;scene.add(grid);
function tree(x,z,s=1){const g=new THREE.Group(),trunk=new THREE.Mesh(new THREE.CylinderGeometry(.15*s,.22*s,1.5*s,7),mat(0x594333));trunk.position.y=.75*s;trunk.castShadow=true;g.add(trunk);for(let i=0;i<3;i++){const crown=new THREE.Mesh(new THREE.ConeGeometry((1.1-i*.15)*s,1.8*s,7),mat(i===0?0x294d3c:0x356447));crown.position.y=(1.7+i*.65)*s;crown.castShadow=true;g.add(crown)}g.position.set(x,0,z);scene.add(g)}
for(let i=0;i<38;i++){const a=i*2.399,r=13+(i%5)*2.1;tree(Math.cos(a)*r,Math.sin(a)*r,.7+(i%4)*.14)}
for(let i=0;i<9;i++){const a=i*Math.PI*2/9,p=new THREE.Mesh(new THREE.BoxGeometry(.7,1.3,.65),mat(0x777c78));p.position.set(Math.cos(a)*5,.65,Math.sin(a)*5);p.rotation.y=-a;p.castShadow=true;scene.add(p)}
const hero=new THREE.Group(),armor=mat(0x263d55,.4,.65),gold=mat(0xd4a64f,.35,.7),skin=mat(0xd9a77f),cloth=mat(0x7a2937);function part(geo,ma,x,y,z){const o=new THREE.Mesh(geo,ma);o.position.set(x,y,z);o.castShadow=true;hero.add(o);return o}
part(new THREE.CylinderGeometry(.34,.43,.9,8),armor,0,1.05,0);part(new THREE.SphereGeometry(.28,10,8),skin,0,1.75,0);part(new THREE.ConeGeometry(.36,.4,8),gold,0,2.08,0);part(new THREE.BoxGeometry(.22,.68,.25),armor,-.47,1.12,0);part(new THREE.BoxGeometry(.22,.68,.25),armor,.47,1.12,0);part(new THREE.BoxGeometry(.24,.7,.28),cloth,-.2,.36,0);part(new THREE.BoxGeometry(.24,.7,.28),cloth,.2,.36,0);
const sword=new THREE.Group(),blade=new THREE.Mesh(new THREE.BoxGeometry(.12,1.25,.08),mat(0xb9d7e8,.2,.9)),hilt=new THREE.Mesh(new THREE.BoxGeometry(.42,.09,.14),gold);blade.position.y=.72;hilt.position.y=.1;sword.add(blade,hilt);sword.position.set(.65,1,0);hero.add(sword);scene.add(hero);
const mobs=[],mobMat=mat(0x6f343e,.8);function spawnMob(x,z){const g=new THREE.Group(),body=new THREE.Mesh(new THREE.DodecahedronGeometry(.65,0),mobMat);body.position.y=.7;body.castShadow=true;g.add(body);const eyeMat=new THREE.MeshBasicMaterial({color:0xff554c});for(const xx of [-.22,.22]){const e=new THREE.Mesh(new THREE.SphereGeometry(.07,6,6),eyeMat);e.position.set(xx,.85,.53);g.add(e)}g.position.set(x,0,z);scene.add(g);mobs.push({g,hp:2,alive:true,phase:Math.random()*6})}spawnMob(4,-5);spawnMob(-5,-7);spawnMob(2,8);spawnMob(-8,2);
let goldCount=120,kills=0,hp=100,mp=60,attackCooldown=0,skillCooldown=0,noticeTimer=0;function notify(t){const n=document.querySelector('#notice');n.textContent=t;n.classList.add('show');noticeTimer=2.2}function updateHud(){document.querySelector('#gold').textContent=goldCount;document.querySelector('#kills').textContent=kills;document.querySelector('#hp').style.width=hp+'%';document.querySelector('#mp').style.width=mp+'%';document.querySelector('#quest').textContent=kills>=3?'Missione completata! Torna alla forgia per potenziare il tuo equipaggiamento.':'Sconfiggi le creature corrotte: '+kills+'/3'}
function doAttack(){if(attackCooldown>0)return;attackCooldown=.55;sword.rotation.z=-1.2;let hit=false;for(const m of mobs){if(!m.alive)continue;if(m.g.position.distanceTo(hero.position)<2.5){m.hp--;hit=true;m.g.position.add(new THREE.Vector3((m.g.position.x-hero.position.x)*.18,0,(m.g.position.z-hero.position.z)*.18));if(m.hp<=0){m.alive=false;scene.remove(m.g);kills++;goldCount+=25;updateHud()}}}notify(hit?'Colpo a segno!':'Attacco a vuoto');if(kills>=3)notify('VITTORIA! Hai completato il primo incarico.')}
function doSkill(){if(skillCooldown>0||mp<25)return;skillCooldown=4;mp-=25;for(const m of mobs){if(m.alive&&m.g.position.distanceTo(hero.position)<4){m.hp-=2;if(m.hp<=0){m.alive=false;scene.remove(m.g);kills++;goldCount+=25}}}updateHud();notify('IMPULSO ARCANO!')}
document.querySelector('#attack').addEventListener('click',doAttack);document.querySelector('#skill').addEventListener('click',doSkill);document.querySelector('#forge').addEventListener('click',()=>{if(goldCount>=50){goldCount-=50;notify('La lama è stata rinforzata! (demo)');sword.scale.setScalar(1.12);updateHud()}else notify('Servono 50 monete per forgiare.')});
let joy={x:0,y:0,active:false};const pad=document.querySelector('#joy'),knob=document.querySelector('#stick');function setJoy(e){const r=pad.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let dx=e.clientX-cx,dy=e.clientY-cy;const len=Math.hypot(dx,dy),max=35;if(len>max){dx*=max/len;dy*=max/len}joy.x=dx/max;joy.y=dy/max;knob.style.left='calc(50% + '+dx+'px)';knob.style.top='calc(50% + '+dy+'px)'}pad.addEventListener('pointerdown',e=>{joy.active=true;pad.setPointerCapture(e.pointerId);setJoy(e)});pad.addEventListener('pointermove',e=>{if(joy.active)setJoy(e)});function endJoy(){joy.active=false;joy.x=joy.y=0;knob.style.left='50%';knob.style.top='50%'}pad.addEventListener('pointerup',endJoy);pad.addEventListener('pointercancel',endJoy);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')doAttack()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
let last=performance.now(),frames=0,fpsTime=0;function loop(now){requestAnimationFrame(loop);const dt=Math.min((now-last)/1000,.04);last=now;frames++;fpsTime+=dt;if(fpsTime>1){document.querySelector('#fps').textContent=frames;frames=0;fpsTime=0}attackCooldown=Math.max(0,attackCooldown-dt);skillCooldown=Math.max(0,skillCooldown-dt);if(noticeTimer>0){noticeTimer-=dt;if(noticeTimer<=0)document.querySelector('#notice').classList.remove('show')}sword.rotation.z=THREE.MathUtils.lerp(sword.rotation.z,0,dt*8);
let mx=joy.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),mz=joy.y+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(mx,mz);if(len>1){mx/=len;mz/=len}if(Math.abs(mx)+Math.abs(mz)>.05){hero.position.x+=mx*5*dt;hero.position.z+=mz*5*dt;hero.rotation.y=Math.atan2(mx,mz);hero.position.x=THREE.MathUtils.clamp(hero.position.x,-18,18);hero.position.z=THREE.MathUtils.clamp(hero.position.z,-18,18)}
for(const m of mobs){if(!m.alive)continue;m.phase+=dt*2;m.g.position.y=Math.sin(m.phase)*.08;const d=m.g.position.distanceTo(hero.position);if(d<9&&d>1.3){const dir=hero.position.clone().sub(m.g.position).normalize();m.g.position.add(dir.multiplyScalar(dt*.65));m.g.rotation.y=Math.atan2(dir.x,dir.z)}}
camera.position.lerp(new THREE.Vector3(hero.position.x,hero.position.y+6,hero.position.z+9),dt*3);camera.lookAt(hero.position.x,1,hero.position.z);renderer.render(scene,camera)}
requestAnimationFrame(loop);addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});updateHud();notify('Benvenuto, apprendista. La tua leggenda comincia qui.');
</script></body></html>
