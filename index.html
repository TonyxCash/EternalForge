function audio(freq=180,duration=.09,type='sine',volume=.04){try{const C=window.AudioContext||window.webkitAudioContext;if(!window.__efAudio)window.__efAudio=new C();const c=window.__efAudio,o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(freq,c.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(40,freq*.55),c.currentTime+duration);g.gain.setValueAtTime(volume,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration)}catch(e){}}
const particles=[];function burst(pos,color=0xf4c779,count=14,power=3){for(let i=0;i<count;i++){const o=new THREE.Mesh(new THREE.SphereGeometry(.045+Math.random()*.04,5,5),new THREE.MeshBasicMaterial({color,transparent:true,opacity:1}));o.position.copy(pos);scene.add(o);const v=new THREE.Vector3((Math.random()-.5)*power,Math.random()*power*.65,(Math.random()-.5)*power);particles.push({o,v,life:.55+Math.random()*.35,max:.9})}}
function hurtMob(m,damage){if(!m.alive)return;m.hp-=damage;m.hit=.22;burst(m.g.position.clone().add(new THREE.Vector3(0,.8,0)),0xf5bc83,9,2.3);audio(260,.07,'triangle',.035);if(m.hp<=0){m.alive=false;scene.remove(m.g);kills++;goldCount+=25;xp+=35;if(xp>=100){level++;xp-=100;toast('LIVELLO '+level+' RAGGIUNTO!');audio(600,.25,'sine',.07)}else toast('Creatura sconfitta · +25 oro');hud()}}
function doAttack(){if(attackCd>0)return;attackCd=.48;combo=comboWindow>0?(combo%3)+1:1;comboWindow=.85;const swing=[-1.15,-1.8,-2.35][combo-1];swordPivot.rotation.x=swing;swordPivot.rotation.z=combo===2?-.65:.35;audio(combo===3?340:220,.12,'sawtooth',.025);let hit=false;const forward=new THREE.Vector3(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));for(const m of mobs){if(!m.alive)continue;const to=m.g.position.clone().sub(hero.position);const d=to.length();to.y=0;if(d<2.8&&d>.001&&forward.dot(to.normalize())>.05){hurtMob(m,(hero.userData.damage||0)+(combo===3?2:1));const push=m.g.position.clone().sub(hero.position).normalize().multiplyScalar(combo===3?1.15:.65);m.g.position.add(push);m.hit=.3;hit=true}}if(!hit)audio(120,.05,'triangle',.012);if(kills>=4)toast('RADURA LIBERATA!')}
function doSkill(){if(skillCd>0||mp<28)return;skillCd=4.5;mp-=28;const center=hero.position.clone();const ring=new THREE.Mesh(new THREE.RingGeometry(.3,2.8,48),new THREE.MeshBasicMaterial({color:0x70caff,transparent:true,opacity:.9,side:THREE.DoubleSide}));ring.rotation.x=-Math.PI/2;ring.position.set(center.x,.08,center.z);scene.add(ring);let life=.55;const tick=()=>{if(!ring.parent)return;life-=.035;ring.scale.multiplyScalar(1.045);ring.material.opacity=Math.max(0,life*1.5);if(life<=0){scene.remove(ring);ring.geometry.dispose();ring.material.dispose()}else requestAnimationFrame(tick)};tick();burst(center.clone().add(new THREE.Vector3(0,.3,0)),0x76caff,32,5);for(const m of mobs){if(m.alive&&m.g.position.distanceTo(center)<4.2)hurtMob(m,2)}audio(500,.25,'sine',.07);hud();toast('ONDA ARCANA!')}
function dodge(){if(dodgeCd>0)return;dodgeCd=1.1;hero.userData.dodge=.24;const dir=new THREE.Vector3(move.x,0,move.z);if(dir.length()<.1)dir.set(Math.sin(hero.rotation.y),0,Math.cos(hero.rotation.y));dir.normalize();hero.userData.dodgeDir=dir;burst(hero.position.clone().add(new THREE.Vector3(0,.25,0)),0xa7d9ef,10,1.5);audio(150,.13,'triangle',.03)}
$('#attack').addEventListener('pointerdown',e=>{e.preventDefault();doAttack()});$('#skill').addEventListener('pointerdown',e=>{e.preventDefault();doSkill()});$('#dodge').addEventListener('pointerdown',e=>{e.preventDefault();dodge()});$('#forge').addEventListener('pointerdown',e=>{e.preventDefault();if(goldCount>=50){goldCount-=50;goldCount+=0;hero.userData.forgeGlow=1.4;toast('Lama rinforzata · potenza aumentata');hero.userData.damage=(hero.userData.damage||0)+1;hud();audio(420,.18,'triangle',.06)}else toast('Servono 50 monete per forgiare')});
let move={x:0,z:0,active:false};const pad=$('#joy'),knob=$('#stick');function setStick(e){const r=pad.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),lim=36,x=len>lim?dx*lim/len:dx,y=len>lim?dy*lim/len:dy;move.x=x/lim;move.z=y/lim;knob.style.left='calc(50% + '+x+'px)';knob.style.top='calc(50% + '+y+'px)'}pad.addEventListener('pointerdown',e=>{move.active=true;pad.setPointerCapture(e.pointerId);setStick(e)});pad.addEventListener('pointermove',e=>{if(move.active)setStick(e)});function stopStick(){move.active=false;move.x=move.z=0;knob.style.left='50%';knob.style.top='50%'}pad.addEventListener('pointerup',stopStick);pad.addEventListener('pointercancel',stopStick);
const keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space')doAttack();if(e.key.toLowerCase()==='shift')dodge()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const clock=new THREE.Clock();let frames=0,fpsElapsed=0;const camTarget=new THREE.Vector3(),camDesired=new THREE.Vector3();const dampAngle=(a,b,lambda,dt)=>a+Math.atan2(Math.sin(b-a),Math.cos(b-a))*(1-Math.exp(-lambda*dt));
function update(dt){gameTime+=dt;let x=move.x+(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),z=move.z+(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);const l=Math.hypot(x,z);if(l>1){x/=l;z/=l}const moving=Math.hypot(x,z)>.08;const speed=keys.shift?7.2:5.1;const targetVX=x*speed,targetVZ=z*speed;hero.userData.vx=THREE.MathUtils.damp(hero.userData.vx||0,targetVX, moving?12:8,dt);hero.userData.vz=THREE.MathUtils.damp(hero.userData.vz||0,targetVZ,moving?12:8,dt);if(hero.userData.dodge>0){hero.position.addScaledVector(hero.userData.dodgeDir,16*dt);hero.userData.dodge-=dt}else hero.position.add(new THREE.Vector3(hero.userData.vx,0,hero.userData.vz).multiplyScalar(dt));hero.position.x=THREE.MathUtils.clamp(hero.position.x,-19,19);hero.position.z=THREE.MathUtils.clamp(hero.position.z,-19,19);if(moving)hero.rotation.y=dampAngle(hero.rotation.y,Math.atan2(x,z),14,dt);
const stride=moving?Math.sin(gameTime*(keys.shift?13:9))*Math.min(1,Math.hypot(hero.userData.vx,hero.userData.vz)/4):0;legL.rotation.x=stride*.68;legR.rotation.x=-stride*.68;shoulderL.rotation.x=-stride*.38;shoulderR.rotation.x=stride*.38;if(moving)torso.rotation.z=THREE.MathUtils.damp(torso.rotation.z,-x*.045,8,dt);else torso.rotation.z=THREE.MathUtils.damp(torso.rotation.z,0,8,dt);torso.position.y=1.15+(moving?Math.abs(stride)*.035:Math.sin(gameTime*2)*.012);
attackCd=Math.max(0,attackCd-dt);skillCd=Math.max(0,skillCd-dt);dodgeCd=Math.max(0,dodgeCd-dt);comboWindow=Math.max(0,comboWindow-dt);swordPivot.rotation.x=THREE.MathUtils.damp(swordPivot.rotation.x,0,13,dt);swordPivot.rotation.z=THREE.MathUtils.damp(swordPivot.rotation.z,0,13,dt);if(hero.userData.forgeGlow>0){hero.userData.forgeGlow-=dt;gold.emissive.setHex(0x9b6b19);gold.emissiveIntensity=.4}else{gold.emissive.setHex(0x000000);gold.emissiveIntensity=0}
for(const m of mobs){if(!m.alive)continue;m.phase+=dt*2.4;m.body.position.y=.72+Math.sin(m.phase)*.055;const delta=hero.position.clone().sub(m.g.position),d=delta.length();if(d<10&&d>1.45){delta.normalize();m.g.position.addScaledVector(delta,dt*1.05);m.g.rotation.y=Math.atan2(delta.x,delta.z);m.walk+=dt*8;m.legs[0].rotation.x=Math.sin(m.walk)*.35;m.legs[1].rotation.x=-Math.sin(m.walk)*.35}if(d<1.65&&m.attack<=0){m.attack=1.35;if(hero.userData.dodge<=0){hp=Math.max(0,hp-7);$('#hp').style.width=hp+'%';toast('Hai subito un colpo!');audio(95,.16,'square',.035);if(hp<=0){hp=100;hero.position.set(0,0,0);toast('Sei stato sconfitto · ritorno alla radura')}}}m.attack=Math.max(0,m.attack-dt);m.hit=Math.max(0,m.hit-dt);m.body.rotation.x=THREE.MathUtils.damp(m.body.rotation.x,m.hit>0?-.3:0,18,dt)}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.life-=dt;p.o.position.addScaledVector(p.v,dt);p.v.y-=5*dt;p.o.material.opacity=Math.max(0,p.life/p.max);p.o.scale.setScalar(Math.max(.05,p.life/p.max));if(p.life<=0){scene.remove(p.o);p.o.geometry.dispose();p.o.material.dispose();particles.splice(i,1)}}
camDesired.set(hero.position.x,hero.position.y+6.6,hero.position.z+9.4);camera.position.lerp(camDesired,1-Math.exp(-4.5*dt));camTarget.set(hero.position.x,1.1,hero.position.z);camera.lookAt(camTarget);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('#toast').classList.remove('show')}mp=Math.min(70,mp+dt*1.7);$('#mp').style.width=(mp/70*100)+'%';}
function loop(){requestAnimationFrame(loop);const dt=Math.min(clock.getDelta(),.04);update(dt);renderer.render(scene,camera);frames++;fpsElapsed+=dt;if(fpsElapsed>=1){$('#fps').textContent=frames;frames=0;fpsElapsed=0}}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7))});hud();toast('Benvenuto nella radura di Ashenvale');loop();
</script>
